<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>参加申請 | 家村祭 2026.11.21 SAT 京都・河原町</title>
<meta name="description" content="家村祭(2026.11.21 土 京都・河原町)の参加申請フォーム">
<style>
  :root{
    --sumi:#1c1a17;
    --sumi-soft:#3d3832;
    --washi:#faf6ee;
    --washi-deep:#f1ead9;
    --shu:#ce3e2c;
    --shu-deep:#a92f20;
    --ai:#234a6b;
    --kin:#c89b3c;
    --serif:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho","Noto Serif JP","BIZ UDMincho",serif;
    --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic","Noto Sans JP",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:var(--sans);color:var(--sumi);background:var(--washi);
    line-height:1.9;min-height:100svh;display:flex;flex-direction:column;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:radial-gradient(rgba(28,26,23,.025) 1px, transparent 1px);
    background-size:5px 5px;
  }
  .matsuri-bg{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:url(images/matsuri-bg.jpg) center 30%/cover no-repeat;
    opacity:.4;filter:saturate(.85) contrast(.96);
  }
  .matsuri-bg::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(250,246,238,.7) 0%,rgba(250,246,238,.35) 40%,rgba(250,246,238,.55) 100%);
  }
  img{max-width:100%;display:block}
  a{color:inherit;text-decoration:none}

  .kouhaku{
    height:14px;flex:none;position:relative;z-index:2;
    background:repeating-linear-gradient(90deg,var(--shu) 0 56px,#fff 56px 112px);
  }
  .kouhaku::after{content:"";position:absolute;left:0;right:0;top:100%;height:6px;
    background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(28,26,23,.06) 10px 56px);}

  .topbar{
    position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;
    padding:1rem 1.4rem;font-size:.82rem;letter-spacing:.15em;
  }
  .back{display:inline-flex;align-items:center;gap:.5rem;color:var(--sumi-soft);transition:color .25s}
  .back:hover{color:var(--shu)}
  .back::before{content:"←";font-family:var(--sans)}
  .topdate{font-family:var(--serif);font-weight:700;letter-spacing:.2em;color:var(--sumi-soft)}

  main{position:relative;z-index:1;flex:1;width:100%;max-width:720px;margin:0 auto;padding:2.5rem 1.4rem 5rem}

  .form-head{text-align:center;margin-bottom:3rem}
  .form-logo{width:min(440px,100%);height:auto;margin:0 auto 1.8rem}
  .inkin{opacity:0;transform:translateY(14px) scale(.985);filter:blur(6px);
    animation:ink .9s cubic-bezier(.22,.8,.3,1) forwards}
  .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}
  @keyframes ink{to{opacity:1;transform:none;filter:none}}

  .page-title{
    font-family:var(--serif);font-weight:700;font-size:1.7rem;letter-spacing:.45em;
    display:flex;align-items:center;justify-content:center;gap:1.2rem;margin-bottom:.6rem;
  }
  .page-title::before,.page-title::after{content:"";width:52px;height:1px;background:var(--shu-deep);opacity:.6}
  .page-en{font-size:.72rem;letter-spacing:.5em;color:var(--shu-deep)}
  .form-lead{
    margin-top:1.6rem;font-size:.92rem;color:var(--sumi-soft);text-align:left;
    max-width:36em;margin-left:auto;margin-right:auto;
  }
  .event-strip{
    margin-top:1.6rem;display:inline-flex;flex-wrap:wrap;justify-content:center;gap:.6rem 1.6rem;
    font-family:var(--serif);font-weight:700;letter-spacing:.2em;font-size:.95rem;
    border:1px solid rgba(28,26,23,.2);border-radius:999px;padding:.5rem 1.8rem;background:rgba(255,255,255,.5);
  }
  .event-strip .dot{color:var(--shu)}

  /* ===== form card ===== */
  .card{
    background:var(--sumi);color:var(--washi);border-radius:14px;overflow:hidden;
    box-shadow:0 18px 44px rgba(28,26,23,.22);
  }
  .card-top{height:10px;background:repeating-linear-gradient(90deg,var(--shu) 0 42px,#fff 42px 84px)}
  .card-inner{padding:2.6rem clamp(1.3rem,5vw,3rem) 3rem}
  form{display:grid;gap:1.7rem}
  .field label{display:block;font-family:var(--serif);font-weight:700;letter-spacing:.2em;font-size:.95rem;margin-bottom:.55rem}
  .req{color:#ff8a76;font-size:.68rem;letter-spacing:.1em;margin-left:.6em;vertical-align:.15em;
    border:1px solid #ff8a76;border-radius:3px;padding:0 .4em}
  .opt{color:rgba(250,246,238,.55);font-size:.68rem;letter-spacing:.1em;margin-left:.6em;vertical-align:.15em;
    border:1px solid rgba(250,246,238,.4);border-radius:3px;padding:0 .4em}
  .hint{font-size:.76rem;color:rgba(250,246,238,.55);margin-top:.4rem;letter-spacing:.04em}
  .field input,.field select,.field textarea{
    width:100%;font:inherit;color:var(--washi);background:rgba(250,246,238,.07);
    border:1px solid rgba(250,246,238,.35);border-radius:9px;padding:.85rem 1rem;
    transition:border-color .25s,background .25s;
  }
  .field select{appearance:none;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--washi) 50%),linear-gradient(135deg,var(--washi) 50%,transparent 50%);
    background-position:calc(100% - 1.3rem) 50%,calc(100% - 1rem) 50%;background-size:5px 5px;background-repeat:no-repeat}
  .field select option{color:var(--sumi);background:var(--washi)}
  .field input:focus,.field select:focus,.field textarea:focus{
    outline:none;border-color:var(--shu);background:rgba(250,246,238,.12)}
  .field input::placeholder,.field textarea::placeholder{color:rgba(250,246,238,.38)}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:1.7rem}
  @media(max-width:560px){.two-col{grid-template-columns:1fr}}

  .submit-btn{
    justify-self:center;width:min(100%,380px);
    font-family:var(--serif);font-weight:700;letter-spacing:.4em;font-size:1.05rem;
    color:var(--washi);background:var(--shu);border:none;border-radius:999px;
    padding:1.1rem 2rem 1.05rem 2.4rem;cursor:pointer;margin-top:.6rem;
    box-shadow:0 10px 26px rgba(206,62,44,.45);transition:transform .25s,background .25s,box-shadow .25s;
  }
  .submit-btn:hover{transform:translateY(-3px);background:#e14b36;box-shadow:0 14px 32px rgba(206,62,44,.5)}
  .submit-btn:focus-visible{outline:2px solid var(--washi);outline-offset:3px}
  .form-foot{font-size:.76rem;color:rgba(250,246,238,.55);letter-spacing:.05em;text-align:center}
  .form-done{display:none;font-family:var(--serif);font-size:1rem;letter-spacing:.12em;
    border:1px solid var(--kin);border-radius:9px;padding:1.3rem 1.5rem;color:var(--kin);margin-top:.4rem}
  .form-done strong{display:block;font-size:1.15rem;letter-spacing:.3em;margin-bottom:.4rem}

  footer{
    position:relative;z-index:1;text-align:center;padding:2.2rem 1.2rem;
    font-size:.72rem;letter-spacing:.2em;color:var(--sumi-soft);
    border-top:1px solid rgba(28,26,23,.12);
  }

  /* ===== タブレット ===== */
  @media(max-width:1024px){
    main{max-width:680px;padding:2.2rem 2rem 4.5rem}
    .form-logo{width:min(400px,62vw)}
  }
  /* ===== スマホ ===== */
  @media(max-width:560px){
    .topbar{padding:.9rem 1rem;font-size:.74rem;letter-spacing:.08em}
    main{padding:1.6rem 1rem 3.5rem}
    .form-head{margin-bottom:2.2rem}
    .form-logo{width:min(300px,80vw);margin-bottom:1.3rem}
    .page-title{font-size:1.45rem;letter-spacing:.35em;gap:.8rem}
    .page-title::before,.page-title::after{width:32px}
    .event-strip{font-size:.82rem;letter-spacing:.12em;padding:.5rem 1.2rem;border-radius:18px}
    .event-strip .dot:nth-of-type(2){flex-basis:100%;height:0;overflow:hidden}
    .form-lead{font-size:.88rem}
    .card-inner{padding:2rem 1.2rem 2.4rem}
    .submit-btn{letter-spacing:.3em}
  }

  @media(prefers-reduced-motion:reduce){
    .inkin{animation:none;opacity:1;transform:none;filter:none}
  }

  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  .field.invalid input,.field.invalid select{border-color:#ff8a76;background:rgba(255,138,118,.08)}
  .field .err{display:none;font-size:.76rem;color:#ff8a76;margin-top:.35rem;letter-spacing:.04em}
  .field.invalid .err{display:block}
  .form-error{display:none;font-size:.85rem;color:#ff8a76;border:1px solid rgba(255,138,118,.5);border-radius:9px;padding:.8rem 1rem;letter-spacing:.04em}
  .form-error.on{display:block}
  .submit-btn[disabled]{opacity:.6;cursor:wait;transform:none}
  .form-done{line-height:1.9}
  .form-done:focus{outline:none}
  .again-btn{display:block;margin-top:1rem;font:inherit;font-size:.82rem;letter-spacing:.15em;color:var(--washi);
    background:transparent;border:1px solid rgba(250,246,238,.4);border-radius:999px;padding:.45rem 1.3rem;cursor:pointer}
  .again-btn:hover{border-color:var(--kin);color:var(--kin)}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const form = document.getElementById('entryForm');
  const btn = document.getElementById('submitBtn');
  const errBox = document.getElementById('formError');
  const done = document.getElementById('formDone');
  const doneText = document.getElementById('doneText');
  const SB_URL = (window.IEMURA_SUPABASE_URL || '').trim();
  const SB_KEY = (window.IEMURA_SUPABASE_KEY || '').trim();
  const db = SB_URL && SB_KEY && window.supabase ? window.supabase.createClient(SB_URL, SB_KEY) : null;
  const FALLBACK_MAIL = 'kaihatsu@reoken.com';

  const msgs = {
    name:'お名前を入力してください',
    count:'参加人数を選択してください',
    university:'大学名を入力してください'
  };
  Object.keys(msgs).forEach(function(k){
    const el = form.elements[k];
    const p = document.createElement('p');
    p.className = 'err'; p.id = 'err-' + k; p.textContent = msgs[k];
    el.closest('.field').appendChild(p);
    el.setAttribute('aria-describedby', (el.getAttribute('aria-describedby')||'') + ' err-' + k);
    el.addEventListener('input', function(){ check(k); });
    el.addEventListener('change', function(){ check(k); });
  });

  function valid(k){
    const v = (form.elements[k].value || '').trim();
    return v.length > 0;
  }
  function check(k){
    const ok = valid(k);
    const f = form.elements[k].closest('.field');
    f.classList.toggle('invalid', !ok);
    form.elements[k].setAttribute('aria-invalid', ok ? 'false' : 'true');
    return ok;
  }
  function showError(t){ errBox.textContent = t; errBox.classList.add('on'); }
  function clearError(){ errBox.textContent = ''; errBox.classList.remove('on'); }
  function showDone(text){
    if (text) doneText.textContent = text;
    form.style.display = 'none';
    done.style.display = 'block';
    done.focus();
    done.scrollIntoView({behavior:'smooth', block:'center'});
  }

  form.addEventListener('submit', async function(ev){
    ev.preventDefault();
    clearError();
    const keys = Object.keys(msgs);
    const bad = keys.filter(function(k){ return !check(k); });
    if (bad.length){ form.elements[bad[0]].focus(); return; }

    const data = {
      name: form.elements.name.value.trim(),
      count: form.elements.count.value,
      university: form.elements.university.value.trim(),
      website: form.elements.website.value
    };

    // ボット対策（見えない入力欄に値が入っていたら保存しない）
    if (data.website){ showDone(); return; }

    if (!db){
      const body = '【家村祭 参加申請】\n\nお名前:' + data.name + '\n参加人数:' + data.count + '\n大学名:' + data.university + '\n';
      location.href = 'mailto:' + FALLBACK_MAIL + '?subject=' + encodeURIComponent('家村祭 参加申請(' + data.name + ')') +
        '&body=' + encodeURIComponent(body);
      showDone('開いたメールをそのまま送信いただければ、申請完了です。メールアプリが開かない場合は、' + FALLBACK_MAIL + ' 宛に入力内容をお送りください。');
      return;
    }

    btn.disabled = true;
    const label = btn.textContent;
    btn.textContent = '送信中…';
    try {
      const { error } = await db.from('entries').insert({
        name: data.name, count: data.count, university: data.university
      });
      if (error) throw new Error('send failed: ' + error.message);
      form.reset();
      keys.forEach(function(k){ form.elements[k].closest('.field').classList.remove('invalid'); });
      showDone();
    } catch (e) {
      showError((e && e.message && !/fetch|network|JSON|send failed/i.test(e.message) ? e.message : '送信できませんでした。通信状況をご確認のうえ、もう一度お試しください。'));
    } finally {
      btn.disabled = false;
      btn.textContent = label;
    }
  });

  document.getElementById('againBtn').addEventListener('click', function(){
    done.style.display = 'none';
    form.style.display = '';
    form.elements.name.focus();
  });
})();
</script>

</body>
</html>
